<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Where true matches are lost</title><desc id="d">75.5 percent found, 14.7 percent missed by blocking, 9.8 percent rejected by the threshold.</desc>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#5B6B7B" stroke-width="1.2"/></marker></defs>
<rect width="960" height="400" fill="#F5F5F5"/>
<text x="36" y="48" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#1A1A1A">Where the 10,429 true matches go</text>
<text x="36" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B7B">3,000 HELD-OUT S1  ·  BASELINE MODEL  ·  K = 17  ·  t = 0.7</text>
<rect x="60" y="152" width="635" height="44" fill="#5B6B7B"/>
<text x="377.5" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-style="normal">75.5%</text>
<rect x="695" y="152" width="123" height="44" fill="#C2410C"/>
<text x="756.5" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-style="normal">14.7%</text>
<rect x="818" y="152" width="82" height="44" fill="#1A1A1A"/>
<text x="859.0" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-style="normal">9.8%</text>
<text x="60" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" font-style="normal">7,871 predicted correctly</text>
<line x1="756" y1="196" x2="756" y2="284" stroke="#C2410C" stroke-width="1"/>
<text x="748" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="400" font-style="normal">1,535 never became candidates (blocking miss at K = 17)</text>
<line x1="860" y1="196" x2="860" y2="332" stroke="#1A1A1A" stroke-width="1"/>
<text x="852" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1A1A1A" text-anchor="end" font-weight="400" font-style="normal">1,023 were candidates but scored below the threshold</text>
<text x="60" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5B6B7B" text-anchor="start" font-weight="400" font-style="italic">Not shown: 433 false positives, a precision cost on top of these misses.</text>

</svg>